# Copy this file for local use and keep real API keys out of version control.
# Environment variables with the MVP_* names take precedence over these values.

embedding:
  backend: glm
  # API keys must not be committed here. Put the embedding key in the project-root
  # .env file (loaded automatically by backend/src/config/env.py):
  #   MVP_EMBEDDING_API_KEY=your_embedding_api_key
  # Or inject it only for the current shell/session:
  #   export MVP_EMBEDDING_API_KEY='your_embedding_api_key'
  # Environment variables take precedence over values in this YAML file.
  api_key: ""
  model: embedding-3  # 支持自定义维度，默认 2048 维
  # OpenAI SDK appends /embeddings; keep this at the API root.
  base_url: https://open.bigmodel.cn/api/paas/v4
  dimensions: 1024  # 自定义输出维度为 1024（比默认的 2048 更节省空间）
  # RAGFlow's Zhipu adapter sends at most 16 texts per API request. Its
  # embedding-3 adapter also truncates every input to 3072 tokens.
  batch_size: 16

llm:
  # If llm.qa fields are empty, the current code falls back to llm.metadata.
  # With the values below, GLM-5.1 is therefore also the default QA model.
  # GLM example:
  #   api_key: "your-glm-api-key"
  #   model: GLM-5.1
  #   base_url: https://open.bigmodel.cn/api/coding/paas/v4
  # DeepSeek example (replace the three values below):
  #   api_key: "your-deepseek-api-key"
  #   model: deepseek-chat
  #   base_url: https://api.deepseek.com
  qa:
    api_key: ""
    model: ""
    base_url: ""
    # Total model context and completion reserve are different quantities.
    # Set context_limit_tokens to the verified limit of the configured model.
    context_limit_tokens: 32768
    completion_reserve_tokens: 1024
    temperature: 0.2
    thinking: ""
  # Optional: used to generate important_kwd/question_kwd during ingestion.
  metadata:
    # Configure this independently when the metadata model needs a different key:
    #   MVP_METADATA_LLM_API_KEY=your_metadata_llm_api_key
    # or: export MVP_METADATA_LLM_API_KEY='your_metadata_llm_api_key'
    api_key: ""
    model: GLM-5.1
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    max_tokens: 512
    thinking: disabled

elasticsearch:
  url: http://localhost:9200
  index: rag-mvp-chunks
  timeout: 30

qa:
  context_top_k: 5
  evidence_window_tokens: 768
  prompt_safety_tokens: 256
  query_rewrite:
    # Rewrite only runs when the request supplies prior user/assistant messages.
    # It reuses the configured QA model and fails open to the original question.
    enabled: true
    max_history_turns: 6
    max_history_tokens: 2048
    prompt_safety_tokens: 128
    max_query_tokens: 256
