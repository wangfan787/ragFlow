# 环境变量 > 根 .env > 本文件；模型调用统一由 LangChain 完成。
data_dir: data/md-rag

embedding:
  backend: glm
  api_key: ""
  model: embedding-3  # 支持自定义维度，默认 2048 维
  base_url: https://open.bigmodel.cn/api/paas/v4
  dimensions: 1024  # 自定义输出维度为 1024（比默认的 2048 更节省空间）
  batch_size: 16

llm:
  qa:
    api_key: ""
    model: GLM-5.1
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    context_limit_tokens: 32768
    completion_reserve_tokens: 1024
    temperature: 0.2
  vision:
    api_key: ""
    model: glm-4.6v-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    max_tokens: 512
    temperature: 0
elasticsearch:
  url: http://localhost:9200
  index: rag-mvp-chunks
  timeout: 30

qa:
  context_top_k: 5
  evidence_window_tokens: 384
  prompt_safety_tokens: 256
